name: Build EduAssist APK

# Runs by itself when you upload the project, and whenever you press "Run workflow".
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Optional: Firebase file for phone alerts (add it as the secret GOOGLE_SERVICES_JSON)
      - name: Add Firebase config (if provided)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" > app/google-services.json; echo "Firebase config added."; else echo "No Firebase config - the app will build without phone alerts."; fi

      # Signing key: uses your saved key (secret KEYSTORE_BASE64) or makes a new one the first time.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "NEW_KEY=no" >> "$GITHUB_ENV"
          else
            PASS="$(openssl rand -hex 12)"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -alias eduassist -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=EduAssist NG, O=Circle World Technologies Africa, C=NG"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "NEW_KEY=yes" >> "$GITHUB_ENV"
            mkdir -p new-key
            cp "$RUNNER_TEMP/release.jks" new-key/release.jks
            base64 -w0 "$RUNNER_TEMP/release.jks" > new-key/KEYSTORE_BASE64.txt
            printf '%s' "$PASS" > new-key/KEYSTORE_PASSWORD.txt
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=eduassist" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$( [ -n "$KS_PASS" ] && echo "$KS_PASS" || echo "$PASS" )" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk EduAssist-NG.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EduAssist-NG-APK
          path: EduAssist-NG.apk

      # Only the first time: keep this safely. You need the same key for every update.
      - uses: actions/upload-artifact@v4
        if: env.NEW_KEY == 'yes'
        with:
          name: SAVE-THIS-signing-key
          path: new-key/
